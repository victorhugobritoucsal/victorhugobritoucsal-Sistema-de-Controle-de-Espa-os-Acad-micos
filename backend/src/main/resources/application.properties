spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/espacos_academicos}
spring.datasource.username=${DB_USERNAME:espacos_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

server.address=127.0.0.1
server.port=8080
server.servlet.session.cookie.same-site=strict

app.gateway-key=${APP_GATEWAY_KEY}
app.admin-senha=${APP_ADMIN_PASSWORD:admin123}
